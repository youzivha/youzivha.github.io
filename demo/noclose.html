<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 小马不关网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .tip {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        #enableBtn {
            background: #2d8cf0;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #enableBtn:hover {
            background: #2b85e4;
        }

        #enableBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 25px;
            font-size: 17px;
            font-weight: bold;
            color: #999;
        }

        .active {
            color: #27ae60 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🔒 小马不关网页</h1>
        <p class="tip">点击下方按钮后，关闭/刷新页面会弹出确认提醒<br>防止意外关闭丢失内容</p>
        
        <button id="enableBtn">帅哥请点击</button>
        <div class="status" id="statusText">保护状态：未激活</div>
    </div>

    <script>
        const enableBtn = document.getElementById('enableBtn');
        const statusText = document.getElementById('statusText');
        const STORAGE_KEY = 'page_close_protection_active';
        let worker = null;

        // 激活保护的核心函数
        function activateProtection() {
            localStorage.setItem(STORAGE_KEY, 'true');
            enableBtn.disabled = true;
            enableBtn.textContent = "✅ 已生效，帅哥请上班";
            statusText.textContent = "后台心跳已挂载，稳固护航中...💪";
            statusText.classList.add('active');
            document.title = "✅ 已生效，防止误关网页";

            // 开启后台保活心跳
            startHeartbeat();
        }

        // 核心技术：用 Web Worker 维持后台心跳，对抗浏览器休眠
        function startHeartbeat() {
            if (window.Worker) {
                // 用 Blob 的方式直接在代码里写 Worker，免去多带一个 JS 文件的麻烦
                const blob = new Blob([`
                    setInterval(() => {
                        postMessage('ping');
                    }, 30000); // 每 30 秒唤醒一次主线程
                `], { type: 'application/javascript' });
                
                worker = new Worker(URL.createObjectURL(blob));
                
                // 收到后台心跳后，主线程刷一下本地存储，证明自己还活着
                worker.onmessage = function() {
                    localStorage.setItem('last_heartbeat', Date.now());
                };
            }
        }

        // 页面刚加载时，自动检查并恢复状态（防止假死刷新后失效）
        if (localStorage.getItem(STORAGE_KEY) === 'true') {
            activateProtection();
        }

        // 手动点击开启
        enableBtn.addEventListener('click', function() {
            activateProtection();
        });

        // 拦截关闭事件
        window.addEventListener('beforeunload', function(e) {
            if (localStorage.getItem(STORAGE_KEY) !== 'true') return;
            
            // 现代浏览器标准写法
            e.preventDefault(); 
            e.returnValue = ''; 
            return '';
        });

        // 每天第一次打开，如果想重置状态，可以在标签页被正常关闭时清除（可选）
        // window.addEventListener('unload', function() {
        //     localStorage.removeItem(STORAGE_KEY);
        // });
    </script>
</body>
</html>
